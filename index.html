<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Hill Township - Interactive Tax & Zoning Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            max-width: 340px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .control-panel h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #333;
        }
        .control-panel h3 {
            font-size: 13px;
            margin: 12px 0 6px;
            color: #555;
            font-weight: 600;
        }
        .control-panel label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 3px 0;
            cursor: pointer;
        }
        .control-panel label input[type="checkbox"] {
            flex-shrink: 0;
        }
        .section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .os-category-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 2px 0;
            cursor: pointer;
        }
        .os-swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .rosi-key {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2.5px solid #b8860b;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .os-swatch.provisional {
            outline: 1.5px dashed #333;
            outline-offset: 1px;
        }
        .highlight-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .highlight-section textarea {
            width: 100%;
            height: 60px;
            margin-top: 6px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            resize: vertical;
        }
        .highlight-section button {
            margin-top: 6px;
            padding: 6px 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }
        .highlight-section button:hover {
            background: #1d4ed8;
        }
        .clear-btn {
            background: #dc2626 !important;
            margin-top: 4px;
        }
        .clear-btn:hover {
            background: #b91c1c !important;
        }
        .status-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }
        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ddd;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .popup-content {
            font-size: 13px;
            line-height: 1.5;
        }
        .popup-content strong {
            color: #1e40af;
        }
        .popup-content .os-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            margin-top: 4px;
        }
        .select-all-row {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }
        .select-all-row button {
            font-size: 10px;
            padding: 2px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: #f8f9fa;
            cursor: pointer;
        }
        .select-all-row button:hover {
            background: #e9ecef;
        }

        /* ---- panel chrome: collapse + tabs ---- */
        .control-panel {
            transition: width .18s ease, max-height .18s ease, padding .18s ease;
        }
        .control-panel.wide { max-width: 680px; }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .panel-header h2 { margin-bottom: 0; }
        .collapse-btn {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            color: #444;
        }
        .collapse-btn:hover { background: #e9ecef; }
        .collapse-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
        .control-panel.collapsed { max-height: none; padding-bottom: 14px; }
        .control-panel.collapsed .panel-body { display: none; }

        .tab-bar {
            display: flex;
            gap: 4px;
            margin: 12px 0 10px;
            border-bottom: 1px solid #e3e3e3;
        }
        .tab {
            padding: 6px 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 12px;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab:hover { color: #222; }
        .tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; font-weight: 600; }

        /* ---- table view ---- */
        .table-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .table-controls input[type="text"] {
            flex: 1;
            min-width: 150px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font: inherit;
            font-size: 12px;
        }
        .tiny { font-size: 11px; color: #555; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .table-meta { font-size: 11px; color: #666; margin-bottom: 6px; }
        .table-scroll { max-height: 52vh; overflow: auto; border: 1px solid #eee; border-radius: 5px; }
        #parcel-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
        #parcel-table th {
            position: sticky;
            top: 0;
            background: #f6f7f8;
            text-align: left;
            padding: 6px 7px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            white-space: nowrap;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .03em;
            color: #555;
        }
        #parcel-table th:hover { background: #ebedef; }
        #parcel-table th .arrow { color: #1d4ed8; }
        #parcel-table td {
            padding: 4px 7px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }
        #parcel-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        #parcel-table tbody tr { cursor: pointer; }
        #parcel-table tbody tr:hover { background: #eff4ff; }
        .rosi-tick { color: #b8860b; margin-right: 4px; }
        .cat-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            margin-right: 5px;
            flex-shrink: 0;
        }
        .export-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background: #fff;
            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }
        .export-btn:hover { background: #eff4ff; }

        @media (max-width: 760px) {
            .control-panel, .control-panel.wide {
                max-width: calc(100vw - 20px);
            }
            .table-scroll { max-height: 44vh; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="control-panel" id="control-panel">
        <div class="panel-header">
            <h2>Long Hill Township Map</h2>
            <button class="collapse-btn" id="collapse-btn" onclick="togglePanel()"
                    title="Collapse panel" aria-label="Collapse panel" aria-expanded="true">&minus;</button>
        </div>

        <div class="panel-body" id="panel-body">
        <div class="tab-bar">
            <button class="tab active" id="tab-btn-filters" onclick="showTab('filters')">Layers &amp; Filters</button>
            <button class="tab" id="tab-btn-table" onclick="showTab('table')">Table</button>
        </div>

        <div id="tab-filters">
        <h3>Layers</h3>
        <label>
            <input type="checkbox" id="toggle-parcels" checked>
            Tax Parcels
        </label>
        <label>
            <input type="checkbox" id="toggle-blocks" checked>
            Block Numbers
        </label>
        <label title="Green Acres ROSI parcels cannot be diverted without NJDEP approval">
            <input type="checkbox" id="toggle-rosi" checked>
            <span class="rosi-key"></span>
            Outline ROSI parcels (<span id="rosi-count">0</span>)
        </label>

        <div class="section">
            <h3>Open Space — by Owner Type</h3>
            <div class="select-all-row">
                <button onclick="toggleAllOS(true)">Select All</button>
                <button onclick="toggleAllOS(false)">Deselect All</button>
            </div>
            <div id="os-checkboxes"></div>
        </div>

        <div class="highlight-section">
            <h3>Highlight Blocks</h3>
            <p style="font-size:11px; color:#666;">Enter block numbers (comma/newline separated):</p>
            <textarea id="block-input" placeholder="e.g. 10101, 10102, 10201"></textarea>
            <button onclick="highlightBlocks()">Highlight</button>
            <button class="clear-btn" onclick="clearHighlights()">Clear Highlights</button>
        </div>
        </div><!-- /tab-filters -->

        <div id="tab-table" hidden>
            <div class="table-controls">
                <input type="text" id="table-search" placeholder="Search block, lot, owner, address&hellip;">
                <label class="tiny"><input type="checkbox" id="table-os-only" checked> Open space only</label>
                <label class="tiny"><input type="checkbox" id="table-rosi-only"> ROSI only</label>
            </div>
            <div class="table-meta" id="table-meta"></div>
            <div class="table-scroll">
                <table id="parcel-table">
                    <thead><tr id="table-head"></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <button class="export-btn" onclick="exportCSV()">Export visible rows as CSV</button>
        </div>
        </div><!-- /panel-body -->
    </div>

    <div class="status-bar" id="status-bar">
        <span class="loading-spinner"></span> Loading parcels...
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        // Normalised lookup so 47.1 and 47.10 resolve to the same parcel.
        const rosiKey = (block, lot) => `${block}_${Number(lot)}`;
        function getRosi(feature) {
            const p = feature.properties;
            if (!p.PCLBLOCK || p.PCLLOT == null) return null;
            return ROSI_PARCELS[rosiKey(p.PCLBLOCK, p.PCLLOT)] || null;
        }

        // Build lookup: block_lot -> category key
        const OPEN_SPACE_LOOKUP = {};
        Object.keys(OPEN_SPACE_CATEGORIES).forEach(category => {

    <script>
        // Initialize map centered on Long Hill Township
        const map = L.map('map', {
            center: [40.6970, -74.4870],
            zoom: 13,
            zoomControl: true
        });

        // Base layers
        const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri'
        });

        const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenTopoMap'
        });

        streets.addTo(map);

        L.control.layers({
            'Streets': streets,
            'Satellite': satellite,
            'Topographic': topo
        }).addTo(map);

        // Layers
        let parcelsLayer = L.layerGroup().addTo(map);
        let blockLabelsLayer = L.layerGroup().addTo(map);

        // State
        let allParcels = [];
        let highlightedBlocks = new Set();
        let activeOSCategories = new Set(Object.keys(OPEN_SPACE_CATEGORIES));
        let showRosi = true;          // outline Green Acres ROSI parcels
        const ROSI_STROKE = '#b8860b';

        // Long Hill Township municipality code
        const MUN_CODE = '1430';
        const FEATURE_SERVICE_URL = 'https://services2.arcgis.com/XVOqAjTOJ5P6ngMu/arcgis/rest/services/Parcels_Composite_NJ_WM/FeatureServer/0';

        // Build open space checkboxes
        function buildOSCheckboxes() {
            const container = document.getElementById('os-checkboxes');
            Object.keys(OPEN_SPACE_CATEGORIES).forEach(key => {
                const cat = OPEN_SPACE_CATEGORIES[key];
                const label = document.createElement('label');
                label.className = 'os-category-label';
                label.innerHTML = `
                    <input type="checkbox" checked data-os-category="${key}">
                    <span class="os-swatch${cat.provisional ? ' provisional' : ''}" style="background:${cat.color}"></span>
                    <span>${cat.label} (${cat.parcels.length})</span>
                `;
                label.querySelector('input').addEventListener('change', function() {
                    if (this.checked) {
                        activeOSCategories.add(key);
                    } else {
                        activeOSCategories.delete(key);
                    }
                    renderParcels();
                    renderTable();
                });
                container.appendChild(label);
            });
        }

        function toggleAllOS(state) {
            const checkboxes = document.querySelectorAll('[data-os-category]');
            checkboxes.forEach(cb => {
                cb.checked = state;
                const key = cb.dataset.osCategory;
                if (state) {
                    activeOSCategories.add(key);
                } else {
                    activeOSCategories.delete(key);
                }
            });
            renderParcels();
        }

        // Fetch parcels from ArcGIS REST API with retry logic
        async function fetchWithRetry(url, retries = 3, delay = 2000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 30000);
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeout);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(r => setTimeout(r, delay * (i + 1)));
                }
            }
        }

        async function loadParcels() {
            const statusBar = document.getElementById('status-bar');
            let allFeatures = [];
            let offset = 0;
            const batchSize = 2000;
            let hasMore = true;

            while (hasMore) {
                statusBar.innerHTML = `<span class="loading-spinner"></span> Loading parcels... (${allFeatures.length} loaded)`;
                
                const params = new URLSearchParams({
                    where: `PCL_MUN = '${MUN_CODE}'`,
                    outFields: 'PAMS_PIN,PCLBLOCK,PCLLOT,PCLQCODE,PCL_MUN,PROP_CLASS,PROP_LOC,OWNER_NAME,BLDG_DESC,LAND_DESC,CALC_ACRE,NET_VALUE,LAST_YR_TX,MUN_NAME',
                    outSR: '4326',
                    f: 'geojson',
                    resultOffset: offset,
                    resultRecordCount: batchSize
                });

                try {
                    const data = await fetchWithRetry(`${FEATURE_SERVICE_URL}/query?${params}`);

                    if (data.features && data.features.length > 0) {
                        allFeatures = allFeatures.concat(data.features);
                        offset += data.features.length;
                        
                        if (data.features.length < batchSize) {
                            hasMore = false;
                        }
                    } else {
                        hasMore = false;
                    }
                } catch (error) {
                    console.error('Error fetching parcels:', error);
                    statusBar.innerHTML = `⚠️ Error loading parcels. <button onclick="loadParcels()" style="margin-left:8px;padding:4px 10px;border:1px solid #ccc;border-radius:4px;cursor:pointer;">Retry</button>`;
                    return;
                }
            }

            allParcels = allFeatures;
            const rosiHere = allFeatures.filter(f => getRosi(f)).length;
            document.getElementById('rosi-count').textContent = rosiHere;
            statusBar.textContent = `✓ ${allFeatures.length} parcels loaded · ${rosiHere} on ROSI`;
            
            renderParcels();
            renderBlockLabels();
            renderTable();

            // Fit map to parcels
            if (parcelsLayer.getLayers().length > 0) {
                const bounds = L.featureGroup(parcelsLayer.getLayers()).getBounds();
                map.fitBounds(bounds, { padding: [20, 20] });
            }

            setTimeout(() => {
                statusBar.style.display = 'none';
            }, 3000);
        }

        function getParcelOSCategory(feature) {
            const block = feature.properties.PCLBLOCK;
            const lot = feature.properties.PCLLOT;
            if (!block || !lot) return null;
            
            const blockLot = `${block}_${lot}`;

            // Inventory keys are plain block_lot (no qualifier suffix), and PCLBLOCK/PCLLOT
            // carry the qualifier separately in PCLQCODE, so a direct lookup covers every case.
            return OPEN_SPACE_LOOKUP[blockLot] || null;
        }

        function renderParcels() {
            parcelsLayer.clearLayers();

            const geoJsonLayer = L.geoJSON({
                type: 'FeatureCollection',
                features: allParcels
            }, {
                style: function(feature) {
                    const block = feature.properties.PCLBLOCK;
                    const isHighlighted = highlightedBlocks.has(block);
                    const osCategory = getParcelOSCategory(feature);
                    const osActive = osCategory && activeOSCategories.has(osCategory);

                    if (isHighlighted) {
                        return {
                            color: '#dc2626',
                            weight: 2.5,
                            fillColor: 'rgba(255,69,0,0.5)',
                            fillOpacity: 0.5
                        };
                    }
                    
                    // ROSI is an encumbrance, not a category: it takes the stroke so a
                    // parcel can show its category fill and its ROSI status at once.
                    const onRosi = showRosi && !!getRosi(feature);

                    if (osActive) {
                        const cat = OPEN_SPACE_CATEGORIES[osCategory];
                        return {
                            color: onRosi ? ROSI_STROKE : cat.color,
                            weight: onRosi ? 3 : (cat.provisional ? 2.5 : 2),
                            dashArray: cat.provisional ? '5,3' : null,
                            fillColor: cat.color,
                            fillOpacity: cat.provisional ? 0.3 : 0.45
                        };
                    }

                    if (onRosi) {
                        return {
                            color: ROSI_STROKE,
                            weight: 3,
                            fillColor: ROSI_STROKE,
                            fillOpacity: 0.15
                        };
                    }

                    return {
                        color: '#4682b4',
                        weight: 0.5,
                        fillColor: 'rgba(70,130,180,0.08)',
                        fillOpacity: 0.2
                    };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    const osCategory = getParcelOSCategory(feature);
                    const osBadge = osCategory 
                        ? `<span class="os-badge" style="background:${OPEN_SPACE_CATEGORIES[osCategory].color}">${OPEN_SPACE_CATEGORIES[osCategory].label}</span><br>` 
                        : '';
                    const r = getRosi(feature);
                    const rosiBadge = r
                        ? `<span class="os-badge" style="background:${ROSI_STROKE}">Green Acres ROSI</span><br>` +
                          `<span style="font-size:11px;color:#555">` +
                          (r.park ? `${r.park}<br>` : '') +
                          (r.ga != null ? `${r.ga} of ${r.acres ?? '?'} acres encumbered` : '') +
                          (r.partial ? ' (partial lot)' : '') +
                          `</span><br>`
                        : '';
                    
                    const popup = `
                        <div class="popup-content">
                            <strong>Block ${p.PCLBLOCK || 'N/A'} / Lot ${p.PCLLOT || 'N/A'}</strong>
                            ${p.PCLQCODE ? ' (Qual: ' + p.PCLQCODE + ')' : ''}<br>
                            ${osBadge}
                            ${rosiBadge}
                            ${p.PROP_LOC ? '📍 ' + p.PROP_LOC + '<br>' : ''}
                            ${p.OWNER_NAME ? '👤 ' + p.OWNER_NAME + '<br>' : ''}
                            ${p.BLDG_DESC ? '🏠 ' + p.BLDG_DESC + '<br>' : ''}
                            ${p.LAND_DESC ? '🌳 ' + p.LAND_DESC + '<br>' : ''}
                            ${p.CALC_ACRE ? '📐 ' + Number(p.CALC_ACRE).toFixed(2) + ' acres<br>' : ''}
                            ${p.PROP_CLASS ? '📋 Class: ' + p.PROP_CLASS + '<br>' : ''}
                            ${p.NET_VALUE ? '💰 Value: $' + Number(p.NET_VALUE).toLocaleString() + '<br>' : ''}
                            ${p.LAST_YR_TX ? '🧾 Taxes: $' + Number(p.LAST_YR_TX).toLocaleString() + '<br>' : ''}
                        </div>
                    `;
                    layer.bindPopup(popup);
                }
            });

            parcelsLayer.addLayer(geoJsonLayer);
        }

        function renderBlockLabels() {
            blockLabelsLayer.clearLayers();

            const blockGroups = {};
            allParcels.forEach(feature => {
                const block = feature.properties.PCLBLOCK;
                if (!block) return;
                if (!blockGroups[block]) {
                    blockGroups[block] = [];
                }
                blockGroups[block].push(feature);
            });

            Object.keys(blockGroups).forEach(block => {
                const features = blockGroups[block];
                let totalLat = 0, totalLng = 0, count = 0;

                features.forEach(f => {
                    if (f.geometry && f.geometry.coordinates) {
                        const coords = f.geometry.type === 'MultiPolygon' 
                            ? f.geometry.coordinates[0][0] 
                            : f.geometry.coordinates[0];
                        if (coords) {
                            coords.forEach(coord => {
                                totalLng += coord[0];
                                totalLat += coord[1];
                                count++;
                            });
                        }
                    }
                });

                if (count > 0) {
                    const centroid = [totalLat / count, totalLng / count];
                    const isHighlighted = highlightedBlocks.has(block);
                    
                    const icon = L.divIcon({
                        className: 'block-label',
                        html: `<div style="
                            font-size: 9px;
                            font-weight: ${isHighlighted ? 'bold' : 'normal'};
                            color: ${isHighlighted ? '#dc2626' : '#1e3a5f'};
                            text-shadow: 1px 1px 1px rgba(255,255,255,0.9);
                            white-space: nowrap;
                            background: ${isHighlighted ? 'rgba(255,220,220,0.85)' : 'rgba(255,255,255,0.5)'};
                            padding: 1px 3px;
                            border-radius: 2px;
                        ">${block}</div>`,
                        iconSize: [0, 0],
                        iconAnchor: [0, 0]
                    });

                    L.marker(centroid, { icon: icon }).addTo(blockLabelsLayer);
                }
            });
        }

        // Highlight functions
        function highlightBlocks() {
            const input = document.getElementById('block-input').value;
            const blocks = input.split(/[\s,]+/).map(b => b.trim()).filter(b => b.length > 0);
            
            highlightedBlocks = new Set(blocks);
            renderParcels();
            renderBlockLabels();

            if (highlightedBlocks.size > 0) {
                const highlightedFeatures = allParcels.filter(f => highlightedBlocks.has(f.properties.PCLBLOCK));
                if (highlightedFeatures.length > 0) {
                    const tempLayer = L.geoJSON({
                        type: 'FeatureCollection',
                        features: highlightedFeatures
                    });
                    map.fitBounds(tempLayer.getBounds(), { padding: [50, 50] });
                }
            }

            showStatus(`✓ ${highlightedBlocks.size} block(s) highlighted`);
        }

        function clearHighlights() {
            highlightedBlocks.clear();
            document.getElementById('block-input').value = '';
            renderParcels();
            renderBlockLabels();
            showStatus('✓ Highlights cleared');
        }

        function showStatus(msg) {
            const statusBar = document.getElementById('status-bar');

        // Layer toggles
        document.getElementById('toggle-parcels').addEventListener('change', function() {

        // ---------------------------------------------------------- panel chrome
        function togglePanel() {

        let activeTab = 'filters';
        function showTab(tab) {
            activeTab = tab;

        // ---------------------------------------------------------- table view
        const COLUMNS = [
            { key: 'block',  label: 'Block',    get: p => p.PCLBLOCK || '' },
            { key: 'lot',    label: 'Lot',      get: p => p.PCLLOT || '' },
            { key: 'cat',    label: 'Category', get: p => p.__cat || '' },
            { key: 'rosi',   label: 'ROSI',     get: p => p.__rosi ? (p.__rosi.park || 'yes') : '' },
            { key: 'owner',  label: 'Owner',    get: p => p.OWNER_NAME || '' },
            { key: 'loc',    label: 'Location', get: p => p.PROP_LOC || '' },
            { key: 'acres',  label: 'Acres',    get: p => p.CALC_ACRE == null ? null : Number(p.CALC_ACRE), num: true },
            { key: 'class',  label: 'Class',    get: p => p.PROP_CLASS || '' }
        ];
        let sortKey = 'block', sortAsc = true;
        const MAX_ROWS = 400;

        function tableRows() {
            const q = (document.getElementById('table-search').value || '').trim().toLowerCase();
            const osOnly = document.getElementById('table-os-only').checked;
            let rows = allParcels.map(f => {
                const p = Object.assign({}, f.properties);
                p.__cat = getParcelOSCategory(f) || '';
                p.__rosi = getRosi(f);
                p.__feature = f;
                return p;
            });
            if (osOnly) rows = rows.filter(p => p.__cat);
            if (document.getElementById('table-rosi-only').checked) rows = rows.filter(p => p.__rosi);
            if (q) rows = rows.filter(p =>
                [p.PCLBLOCK, p.PCLLOT, p.__cat, p.OWNER_NAME, p.PROP_LOC,
                 p.__rosi ? 'rosi ' + (p.__rosi.park || '') : '']
                    .some(v => String(v || '').toLowerCase().includes(q)));
            const col = COLUMNS.find(c => c.key === sortKey);
            rows.sort((a, b) => {
                let x = col.get(a), y = col.get(b);
                if (col.num) { x = x ?? -Infinity; y = y ?? -Infinity; return sortAsc ? x - y : y - x; }
                const c = String(x).localeCompare(String(y), undefined, { numeric: true });
                return sortAsc ? c : -c;
            });
            return rows;
        }

        function renderTable() {
            if (activeTab !== 'table') return;
            const rows = tableRows();
            const shown = rows.slice(0, MAX_ROWS);

            document.getElementById('table-head').innerHTML = COLUMNS.map(c =>
                `<th onclick="sortTable('${c.key}')">${c.label}` +
                (sortKey === c.key ? ` <span class="arrow">${sortAsc ? '\u25b2' : '\u25bc'}</span>` : '') +
                `</th>`).join('');

            document.getElementById('table-body').innerHTML = shown.map((p, i) => {
                const cat = p.__cat, color = cat ? OPEN_SPACE_CATEGORIES[cat].color : null;
                return `<tr onclick="focusParcel(${i})">` + COLUMNS.map(c => {
                    const v = c.get(p);
                    if (c.key === 'rosi')
                        return `<td>${p.__rosi
                            ? `<span class="rosi-tick">\u25c6</span>${p.__rosi.park || ''}` +
                              (p.__rosi.partial ? ' <span style="color:#888">(partial)</span>' : '')
                            : ''}</td>`;
                    if (c.key === 'cat')
                        return `<td>${cat ? `<span class="cat-dot" style="background:${color}"></span>${cat}` : '<span style="color:#aaa">\u2014</span>'}</td>`;
                    if (c.num)
                        return `<td class="num">${v == null ? '' : v.toFixed(2)}</td>`;
                    return `<td>${String(v)}</td>`;
                }).join('') + `</tr>`;
            }).join('');

            window.__tableShown = shown;
            const meta = document.getElementById('table-meta');
            meta.textContent = rows.length > MAX_ROWS
                ? `Showing first ${MAX_ROWS} of ${rows.length} parcels \u2014 search to narrow.`
                : `${rows.length} parcel${rows.length === 1 ? '' : 's'}.`;
        }

        function sortTable(key) {
            if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
            renderTable();
        }

        function focusParcel(i) {
            const p = (window.__tableShown || [])[i];
            if (!p || !p.__feature) return;
            const layer = L.geoJSON(p.__feature);
            map.fitBounds(layer.getBounds().pad(1.5));
            L.popup()
                .setLatLng(layer.getBounds().getCenter())
                .setContent(`<div class="popup-content"><strong>Block ${p.PCLBLOCK} / Lot ${p.PCLLOT}</strong><br>` +
                    (p.__cat ? `${p.__cat}<br>` : '') +
                    (p.PROP_LOC ? `\ud83d\udccd ${p.PROP_LOC}<br>` : '') +
                    (p.OWNER_NAME ? `\ud83d\udc64 ${p.OWNER_NAME}` : '') + `</div>`)
                .openOn(map);
        }

        function exportCSV() {
            const rows = tableRows();
            const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            const csv = [COLUMNS.map(c => esc(c.label)).join(',')]
                .concat(rows.map(p => COLUMNS.map(c => {
                    const v = c.get(p);
                    return esc(c.num ? (v == null ? '' : v.toFixed(2)) : v);
                }).join(',')))
                .join('\n');
            const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            const a = Object.assign(document.createElement('a'), {
                href: url,
                download: `long-hill-parcels-${new Date().toISOString().slice(0, 10)}.csv`
            });
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            showStatus(`\u2713 Exported ${rows.length} rows`);
        }

        document.getElementById('table-search').addEventListener('input', renderTable);
        document.getElementById('table-os-only').addEventListener('change', renderTable);
        document.getElementById('table-rosi-only').addEventListener('change', renderTable);

        // Init
        buildOSCheckboxes();
        loadParcels();
    </script>
</body>
</html>
